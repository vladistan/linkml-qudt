id: http://qudt.org/3.1.6/schema/qudt
name: qudt
title: QUDT Ontology in LinkML
version: 0.0.2
description: This is a LinkML representation of the QUDT (Quantities, Units, 
  Dimensions and Types) ontology. QUDT provides a comprehensive vocabulary for 
  describing physical quantities, units of measure, and their relationships in a
  machine-readable format.
license: CC-BY-4.0
imports:
- linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  qudt: https://w3id.org/None/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  owl: http://www.w3.org/2002/07/owl#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  dc: http://purl.org/dc/elements/1.1/
  dcterms: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
  voag: http://voag.linkedmodel.org/schema/voag#
  vaem: http://www.linkedmodel.org/schema/vaem#
  dtype: http://www.linkedmodel.org/schema/dtype#
default_prefix: qudt
classes:
  Thing:
    description: The root class for all QUDT concepts
    class_uri: owl:Thing
  AbstractQuantityKind:
    is_a: Concept
    slot_usage:
      broader:
        range: QuantityKind
      altSymbol:
        required: false
      latexSymbol:
        required: false
      symbol:
        multivalued: false
    class_uri: qudt:AbstractQuantityKind
  AngleUnit:
    is_a: DimensionlessUnit
    class_uri: qudt:AngleUnit
  Aspect:
    comments:
    - An aspect is an abstract type class that defines properties that can be 
      reused.^^rdf:HTML
    is_a: Thing
    class_uri: qudt:Aspect
  AspectClass:
    is_a: Class
    class_uri: qudt:AspectClass
  BaseDimensionMagnitude:
    comments:
    - "<p class=\\\"lm-para\\\">A <em>Dimension</em> expresses a magnitude for a base
      quantiy kind such as mass, length and time.</p>\n<p class=\\\"lm-para\\\">DEPRECATED
      - each exponent is expressed as a property. Keep until a validaiton of this
      has been done.</p>^^rdf:HTML"
    is_a: Concept
    slot_usage:
      hasBaseQuantityKind:
        range: QuantityKind
        required: true
        multivalued: false
      vectorMagnitude:
        range: float
        required: true
        multivalued: false
    class_uri: qudt:BaseDimensionMagnitude
  BinaryPrefix:
    comments:
    - A <em>Binary Prefix</em> is a prefix for multiples of units in data 
      processing, data transmission, and digital information, notably the bit 
      and the byte, to indicate multiplication by a power of 2.
    is_a: Prefix
    class_uri: qudt:BinaryPrefix
  BitEncodingType:
    is_a: Encoding
    class_uri: qudt:BitEncodingType
  BooleanEncodingType:
    is_a: Encoding
    class_uri: qudt:BooleanEncodingType
  ByteEncodingType:
    is_a: Encoding
    class_uri: qudt:ByteEncodingType
  CardinalityType:
    is_a: EnumeratedValue
    slot_usage:
      literal:
        multivalued: false
    class_uri: qudt:CardinalityType
  CharEncodingType:
    is_a: Encoding
    class_uri: qudt:CharEncodingType
  Citation:
    comments:
    - Provides a simple way of making citations.^^rdf:HTML
    is_a: Concept
    slot_usage:
      description:
        required: true
        multivalued: false
      url:
        multivalued: false
    class_uri: qudt:Citation
  Comment:
    is_a: Verifiable
    slot_usage:
      rationale:
        required: false
      description:
        multivalued: false
    class_uri: qudt:Comment
  Concept:
    comments:
    - The root class for all QUDT concepts.^^rdf:HTML
    is_a: Thing
    slots:
    - guidance
    - id
    slot_usage:
      hasRule:
        range: Rule
      isReplacedBy:
        multivalued: false
      description:
        multivalued: false
      abbreviation:
        multivalued: false
      deprecated:
        multivalued: false
      id:
        multivalued: false
      plainTextDescription:
        multivalued: false
    class_uri: qudt:Concept
  ConstantValue:
    comments:
    - Used to specify the values of a constant.^^rdf:HTML
    is_a: QuantityValue
    slot_usage:
      exactConstant:
        required: false
    class_uri: qudt:ConstantValue
  ContextualUnit:
    is_a: Unit
    slot_usage:
      broader:
        range: Unit
    class_uri: qudt:ContextualUnit
  CountingUnit:
    comments:
    - Used for all units that express counts. Examples are Atomic Number, 
      Number, Number per Year, Percent and Sample per Second.^^rdf:HTML
    is_a: DimensionlessUnit
    class_uri: qudt:CountingUnit
  CurrencyUnit:
    comments:
    - "Currency Units have their own subclass of unit because: (a) they have additional
      properties such as 'country' and (b) their URIs do not conform to the same rules
      as other units.^^rdf:HTML"
    - Used for all units that express currency.^^rdf:HTML
    is_a: DimensionlessUnit
    slot_usage:
      currencyCode:
        multivalued: false
      currencyExponent:
        multivalued: false
    class_uri: qudt:CurrencyUnit
  DataEncoding:
    comments:
    - <p><em>Data Encoding</em> expresses the properties that specify how data 
      is represented at the bit and byte level. These properties are applicable 
      to describing raw data.</p>^^rdf:HTML
    is_a: Aspect
    slot_usage:
      bitOrder:
        range: EndianType
        multivalued: false
      encoding:
        range: Encoding
        multivalued: false
      byteOrder:
        multivalued: false
    class_uri: qudt:DataEncoding
  DataItem:
    is_a: Concept
    slot_usage:
      value:
        range: string
        multivalued: false
    class_uri: qudt:DataItem
  Datatype:
    is_a: Concept
    slot_usage:
      basis:
        range: Datatype
        multivalued: false
      cardinality:
        range: CardinalityType
        multivalued: false
      orderedType:
        range: OrderedType
        multivalued: false
      ansiSQLName:
        multivalued: false
      cName:
        multivalued: false
      oracleSQLName:
        multivalued: false
      protocolBuffersName:
        multivalued: false
      pythonName:
        multivalued: false
      vbName:
        multivalued: false
      bounded:
        multivalued: false
      id:
        multivalued: false
      javaName:
        multivalued: false
      jsName:
        multivalued: false
      matlabName:
        multivalued: false
      microsoftSQLServerName:
        multivalued: false
      mySQLName:
        multivalued: false
      odbcName:
        multivalued: false
      oleDBName:
        multivalued: false
    class_uri: rdfs:Datatype
  DateTimeStringEncodingType:
    is_a: StringEncodingType
    slot_usage:
      allowedPattern:
        required: true
    class_uri: qudt:DateTimeStringEncodingType
  DecimalPrefix:
    comments:
    - A <em>Decimal Prefix</em> is a prefix for multiples of units that are 
      powers of 10.
    is_a: Prefix
    class_uri: qudt:DecimalPrefix
  DerivedUnit:
    comments:
    - A DerivedUnit is a type specification for units that are derived from 
      other units.^^rdf:HTML
    is_a: Unit
    class_uri: qudt:DerivedUnit
  DimensionlessUnit:
    comments:
    - A Dimensionless Unit is a quantity for which all the exponents of the 
      factors corresponding to the base quantities in its quantity dimension are
      zero.^^rdf:HTML
    is_a: Unit
    class_uri: qudt:DimensionlessUnit
  Discipline:
    is_a: Concept
    class_uri: qudt:Discipline
  Encoding:
    is_a: Concept
    slot_usage:
      bits:
        multivalued: false
      bytes:
        multivalued: false
    class_uri: qudt:Encoding
  EndianType:
    is_a: EnumeratedValue
    class_uri: qudt:EndianType
  EnumeratedQuantity:
    is_a: Concept
    slot_usage:
      enumeratedValue:
        range: EnumeratedValue
      enumeration:
        range: Enumeration
    class_uri: qudt:EnumeratedQuantity
  EnumeratedValue:
    is_a: Verifiable
    mixins:
    - Concept
    slot_usage:
      altSymbol:
        required: false
      description:
        multivalued: false
      abbreviation:
        multivalued: false
      symbol:
        multivalued: false
    class_uri: qudt:EnumeratedValue
  Enumeration:
    comments:
    - "<p>An enumeration is a set of literals from which a single value is selected.
      Each literal can have a tag as an integer within a standard encoding appropriate
      to the range of integer values. Consistency of enumeration types will allow
      them, and the enumerated values, to be referred to unambiguously either through
      symbolic name or encoding. Enumerated values are also controlled vocabularies
      and as such need to be standardized. Without this consistency enumeration literals
      can be stated differently and result in  data conflicts and misinterpretations.</p>\n\
      \n<p>The tags are a set of positive whole numbers, not necessarily contiguous
      and having no numerical significance, each corresponding to the associated literal
      identifier. An order attribute can also be given on the enumeration elements.
      An enumeration can itself be a member of an enumeration. This allows enumerations
      to be enumerated in a selection. Enumerations are also subclasses of <em>Scalar
      Datatype</em>. This allows them to be used as the reference of a datatype specification.</p>^^rdf:HTML"
    is_a: Concept
    slot_usage:
      default:
        range: EnumeratedValue
        multivalued: false
      element:
        range: EnumeratedValue
        required: true
      abbreviation:
        multivalued: false
    class_uri: qudt:Enumeration
  EnumerationScale:
    is_a: Scale
    mixins:
    - Enumeration
    class_uri: qudt:EnumerationScale
  Figure:
    is_a: Concept
    slot_usage:
      imageLocation:
        required: true
        multivalued: false
      figureCaption:
        multivalued: false
      figureLabel:
        multivalued: false
      height:
        multivalued: false
      image:
        multivalued: false
      landscape:
        multivalued: false
      width:
        multivalued: false
    class_uri: qudt:Figure
  FloatingPointEncodingType:
    is_a: Encoding
    class_uri: qudt:FloatingPointEncodingType
  IntegerEncodingType:
    is_a: Encoding
    class_uri: qudt:IntegerEncodingType
  IntervalScale:
    comments:
    - "<p>The interval type allows for the degree of difference between items, but
      not the ratio between them. Examples include temperature with the Celsius scale,
      which has two defined points (the freezing and boiling point of water at specific
      conditions) and then separated into 100 intervals, date when measured from an
      arbitrary epoch (such as AD), percentage such as a percentage return on a stock,[16]
      location in Cartesian coordinates, and direction measured in degrees from true
      or magnetic north. Ratios are not meaningful since 20 °C cannot be said to be
      \\\"twice as hot\\\" as 10 °C, nor can multiplication/division be carried out
      between any two dates directly. However, ratios of differences can be expressed;
      for example, one difference can be twice another. Interval type variables are
      sometimes also called \\\"scaled variables\\\", but the formal mathematical
      term is an affine space (in this case an affine line).</p>\n<p>Characteristics:
      median, percentile &amp; Monotonic increasing (order (&lt;) &amp; totally ordered
      set</p>^^rdf:HTML"
    - median, percentile & Monotonic increasing (order (<)) & totally ordered 
      set^^rdf:HTML
    is_a: Scale
    class_uri: qudt:IntervalScale
  LogarithmicUnit:
    comments:
    - Logarithmic units are abstract mathematical units that can be used to 
      express any quantities (physical or mathematical) that are defined on a 
      logarithmic scale, that is, as being proportional to the value of a 
      logarithm function. Examples of logarithmic units include common units of 
      information and entropy, such as the bit, and the byte, as well as units 
      of relative signal strength magnitude such as the decibel.^^rdf:HTML
    is_a: DimensionlessUnit
    class_uri: qudt:LogarithmicUnit
  MathsFunctionType:
    is_a: Concept
    class_uri: qudt:MathsFunctionType
  NIST_SP811_Comment:
    is_a: Comment
    class_uri: qudt:NIST_SP811_Comment
  NominalScale:
    comments:
    - 'A nominal scale differentiates between items or subjects based only on their
      names or (meta-)categories and other qualitative classifications they belong
      to; thus dichotomous data involves the construction of classifications as well
      as the classification of items. Discovery of an exception to a classification
      can be viewed as progress. Numbers may be used to represent the variables but
      the numbers do not have numerical value or relationship: For example, a Globally
      unique identifier. Examples of these classifications include gender, nationality,
      ethnicity, language, genre, style, biological species, and form. In a university
      one could also use hall of affiliation as an example.^^rdf:HTML'
    is_a: Scale
    class_uri: qudt:NominalScale
  NumericUnion:
    mixins:
    - Concept
    class_uri: qudt:NumericUnion
  OrderedType:
    is_a: EnumeratedValue
    slot_usage:
      literal:
        multivalued: false
    class_uri: qudt:OrderedType
  OrdinalScale:
    comments:
    - The ordinal type allows for rank order (1st, 2nd, 3rd, etc.) by which data
      can be sorted, but still does not allow for relative degree of difference 
      between them. Examples include, on one hand, dichotomous data with 
      dichotomous (or dichotomized) values such as 'sick' vs. 'healthy' when 
      measuring health, 'guilty' vs. 'innocent' when making judgments in courts,
      'wrong/false' vs. 'right/true' when measuring truth value, and, on the 
      other hand, non-dichotomous data consisting of a spectrum of values, such 
      as 'completely agree', 'mostly agree', 'mostly disagree', 'completely 
      disagree' when measuring opinion.^^rdf:HTML
    is_a: Scale
    slot_usage:
      order:
        required: true
        multivalued: false
    class_uri: qudt:OrdinalScale
  Organization:
    is_a: Concept
    slot_usage:
      url:
        required: false
    class_uri: qudt:Organization
  PhysicalConstant:
    comments:
    - A physical constant is a physical quantity that is generally believed to 
      be both universal in nature and constant in time. It can be contrasted 
      with a mathematical constant, which is a fixed numerical value but does 
      not directly involve any physical measurement. There are many physical 
      constants in science, some of the most widely recognized being the speed 
      of light in vacuum c, Newton's gravitational constant G, Planck's constant
      h, the electric permittivity of free space ε0, and the elementary charge 
      e. Physical constants can take many dimensional forms, or may be 
      dimensionless depending on the system of quantities and units 
      used.^^rdf:HTML
    is_a: Quantity
    slot_usage:
      applicableSystem:
        range: SystemOfUnits
      applicableUnit:
        range: Unit
      exactMatch:
        range: PhysicalConstant
      hasDimensionVector:
        range: QuantityKindDimensionVector
      ucumCode:
        required: false
      exactConstant:
        range: boolean
      altSymbol:
        required: false
      isoNormativeReference:
        required: false
      latexSymbol:
        required: false
      normativeReference:
        required: false
      symbol:
        required: false
      latexDefinition:
        multivalued: false
      mathMLdefinition:
        multivalued: false
    class_uri: qudt:PhysicalConstant
  PlaneAngleUnit:
    is_a: AngleUnit
    class_uri: qudt:PlaneAngleUnit
  Prefix:
    is_a: Verifiable
    mixins:
    - Concept
    slot_usage:
      exactMatch:
        range: Prefix
      ucumCode:
        range: UCUMcs-term
      altSymbol:
        required: false
      latexSymbol:
        required: false
      symbol:
        required: false
      prefixMultiplier:
        multivalued: false
    class_uri: qudt:Prefix
  Quantifiable:
    comments:
    - <p><em>Quantifiable</em> ascribes to some thing the capability of being 
      measured, observed, or counted.</p>^^rdf:HTML
    is_a: Aspect
    slot_usage:
      dataEncoding:
        range: DataEncoding
        multivalued: false
      datatype:
        range: Datatype
        multivalued: false
      hasUnit:
        range: Unit
        multivalued: false
      relativeStandardUncertainty:
        range: double
        multivalued: false
      standardUncertainty:
        range: decimal
        multivalued: false
      standardUncertaintySN:
        range: double
      value:
        multivalued: false
      valueSN:
        multivalued: false
    class_uri: qudt:Quantifiable
  Quantity:
    comments:
    - "<p class=\\\"lm-para\\\">A <b>quantity</b> is the measurement of an observable
      property of a particular object, event, or physical system.\n  A quantity is
      always associated with the context of measurement (i.e. the thing measured,
      the measured value, the accuracy of measurement, etc.) whereas the\n  underlying
      <b>quantity kind</b> is independent of any particular measurement. Thus, length
      is a quantity kind while the height of a rocket is a specific\n  quantity of
      length; its magnitude that may be expressed in meters, feet, inches, etc. Examples
      of physical quantities include physical constants, such as\n  the speed of light
      in a vacuum, Planck's constant, the electric permittivity of free space, and
      the fine structure constant. </p>\n<p class=\\\"lm-para\\\">In other words,
      quantities are quantifiable aspects of the world, such as the duration of a
      movie, the distance between two points,\nvelocity of a car, the pressure of
      the atmosphere, and a person's weight; and units are used to describe their
      numerical measure.</p>\n<p class=\\\"lm-para\\\">Many <b>quantity kinds</b>
      are related to each other by various physical laws, and as a result, the associated
      units of some quantity\nkinds can be expressed as products (or ratios) of powers
      of other quantity kinds (e.g., momentum is mass times velocity and velocity
      is defined as distance\ndivided by time). In this way, some quantities can be
      calculated from other measured quantities using their associations to the quantity
      kinds in these\nexpressions. These quantity kind relationships are also discussed
      in dimensional analysis. Those that cannot be so expressed can be regarded\n\
      as \\\"fundamental\\\" in this sense.</p>\n<p class=\\\"lm-para\\\">A quantity
      is distinguished from a \\\"quantity kind\\\" in that the former carries a value
      and the latter is a type specifier.</p>^^rdf:HTML"
    is_a: Quantifiable
    mixins:
    - Concept
    slot_usage:
      hasQuantityKind:
        range: QuantityKind
        required: false
      quantityValue:
        range: QuantityValue
      isDeltaQuantity:
        range: boolean
    class_uri: qudt:Quantity
  QuantityKind:
    comments:
    - A <b>Quantity Kind</b> is any observable property that can be  measured 
      and quantified numerically. Familiar examples include physical properties 
      such as length, mass, time, force, energy, power, electric charge, etc. 
      Less familiar examples include currency, interest rate, price to earning 
      ratio, and information capacity.^^rdf:HTML
    is_a: Verifiable
    mixins:
    - AbstractQuantityKind
    slots:
    - belongsToSystemOfQuantities
    slot_usage:
      dimensionVectorForSI:
        range: QuantityKindDimensionVector_SI
        multivalued: false
      exactMatch:
        range: QuantityKind
      hasDimensionVector:
        range: QuantityKindDimensionVector
      iec61360Code:
        range: string
      applicableCGSUnit:
        required: false
      applicableISOUnit:
        required: false
      applicableImperialUnit:
        required: false
      applicableSIUnit:
        required: false
      applicableUSCustomaryUnit:
        required: false
      applicableUnit:
        required: false
      qkdvDenominator:
        multivalued: false
      qkdvNumerator:
        multivalued: false
      latexDefinition:
        multivalued: false
      mathMLdefinition:
        multivalued: false
    class_uri: qudt:QuantityKind
  QuantityKindDimensionVector:
    comments:
    - "<p class=\\\"lm-para\\\">A  <em>Quantity Kind Dimension Vector</em> describes
      the dimensionality of a quantity kind in the context of a system of units. In
      the SI system of units, the dimensions of a quantity kind are expressed as a
      product of the basic physical dimensions mass ($M$), length ($L$), time ($T$)
      current ($I$), amount of substance ($N$), luminous intensity ($J$) and absolute
      temperature ($\\\\theta$) as $dim \\\\, Q = L^{\\\\alpha} \\\\, M^{\\\\beta}
      \\\\, T^{\\\\gamma} \\\\, I ^{\\\\delta} \\\\, \\\\theta ^{\\\\epsilon} \\\\
      , N^{\\\\eta} \\\\, J ^{\\\\nu}$.</p>\n\n<p class=\\\"lm-para\\\">The rational
      powers of the dimensional exponents, $\\\\alpha, \\\\, \\\\beta, \\\\, \\\\\
      gamma, \\\\, \\\\delta, \\\\, \\\\epsilon, \\\\, \\\\eta, \\\\, \\\\nu$, are
      positive, negative, or zero.</p>\n\n<p class=\\\"lm-para\\\">For example, the
      dimension of the physical quantity kind $\\\\it{speed}$ is $\\\\boxed{length/time}$,
      $L/T$ or $LT^{-1}$, and the dimension of the physical quantity kind force is
      $\\\\boxed{mass \\\\times acceleration}$ or $\\\\boxed{mass \\\\times (length/time)/time}$,
      $ML/T^2$ or $MLT^{-2}$ respectively.</p>^^rdf:HTML"
    is_a: Concept
    slot_usage:
      hasReferenceQuantityKind:
        range: QuantityKind
      latexSymbol:
        required: false
      dimensionExponentForAmountOfSubstance:
        required: true
        multivalued: false
      dimensionExponentForElectricCurrent:
        required: true
        multivalued: false
      dimensionExponentForLength:
        required: true
        multivalued: false
      dimensionExponentForLuminousIntensity:
        required: true
        multivalued: false
      dimensionExponentForMass:
        required: true
        multivalued: false
      dimensionExponentForThermodynamicTemperature:
        required: true
        multivalued: false
      dimensionExponentForTime:
        required: true
        multivalued: false
      dimensionlessExponent:
        required: true
        multivalued: false
      latexDefinition:
        multivalued: false
    class_uri: qudt:QuantityKindDimensionVector
  QuantityKindDimensionVector_CGS:
    comments:
    - A <em>CGS Dimension Vector</em> is used to specify the dimensions for a 
      C.G.S. quantity kind.^^rdf:HTML
    is_a: QuantityKindDimensionVector
    class_uri: qudt:QuantityKindDimensionVector_CGS
  QuantityKindDimensionVector_CGS-EMU:
    comments:
    - A <em>CGS EMU Dimension Vector</em> is used to specify the dimensions for 
      EMU C.G.S. quantity kind.^^rdf:HTML
    is_a: QuantityKindDimensionVector_CGS
    class_uri: qudt:QuantityKindDimensionVector_CGS-EMU
  QuantityKindDimensionVector_CGS-ESU:
    comments:
    - A <em>CGS ESU Dimension Vector</em> is used to specify the dimensions for 
      ESU C.G.S. quantity kind.^^rdf:HTML
    is_a: QuantityKindDimensionVector_CGS
    class_uri: qudt:QuantityKindDimensionVector_CGS-ESU
  QuantityKindDimensionVector_CGS-GAUSS:
    comments:
    - A <em>CGS GAUSS Dimension Vector</em> is used to specify the dimensions 
      for Gaussioan C.G.S. quantity kind.^^rdf:HTML
    is_a: QuantityKindDimensionVector_CGS
    class_uri: qudt:QuantityKindDimensionVector_CGS-GAUSS
  QuantityKindDimensionVector_CGS-LH:
    comments:
    - A <em>CGS LH Dimension Vector</em> is used to specify the dimensions for 
      Lorentz-Heaviside C.G.S. quantity kind.^^rdf:HTML
    is_a: QuantityKindDimensionVector_CGS
    class_uri: qudt:QuantityKindDimensionVector_CGS-LH
  QuantityKindDimensionVector_ISO:
    is_a: QuantityKindDimensionVector
    class_uri: qudt:QuantityKindDimensionVector_ISO
  QuantityKindDimensionVector_Imperial:
    is_a: QuantityKindDimensionVector
    class_uri: qudt:QuantityKindDimensionVector_Imperial
  QuantityKindDimensionVector_SI:
    is_a: QuantityKindDimensionVector
    class_uri: qudt:QuantityKindDimensionVector_SI
  QuantityType:
    is_a: EnumeratedValue
    slot_usage:
      value:
        range: QuantityKind
    class_uri: qudt:QuantityType
  QuantityValue:
    comments:
    - A <i>Quantity Value</i> expresses the magnitude and kind of a quantity and
      is given by the product of a numerical value <code>n</code> and a unit of 
      measure <code>U</code>. The number multiplying the unit is referred to as 
      the numerical value of the quantity expressed in that unit. Refer to <a 
      href=\"http://physics.nist.gov/Pubs/SP811/sec07.html\">NIST SP 811 section
      7</a> for more on quantity values.^^rdf:HTML
    is_a: Quantifiable
    mixins:
    - Concept
    slot_usage:
      hasUnit:
        multivalued: false
    class_uri: qudt:QuantityValue
  RatioScale:
    comments:
    - The ratio type takes its name from the fact that measurement is the 
      estimation of the ratio between a magnitude of a continuous quantity and a
      unit magnitude of the same kind (Michell, 1997, 1999). A ratio scale 
      possesses a meaningful (unique and non-arbitrary) zero value. Most 
      measurement in the physical sciences and engineering is done on ratio 
      scales. Examples include mass, length, duration, plane angle, energy and 
      electric charge. In contrast to interval scales, ratios are now meaningful
      because having a non-arbitrary zero point makes it meaningful to say, for 
      example, that one object has \"twice the length\" of another (= is \"twice
      as long\"). Very informally, many ratio scales can be described as 
      specifying \"how much\" of something (i.e. an amount or magnitude) or 
      \"how many\" (a count). The Kelvin temperature scale is a ratio scale 
      because it has a unique, non-arbitrary zero point called absolute 
      zero.^^rdf:HTML
    is_a: Scale
    class_uri: qudt:RatioScale
  Rule:
    is_a: Verifiable
    mixins:
    - Concept
    slot_usage:
      ruleType:
        range: RuleType
      rationale:
        required: false
    class_uri: qudt:Rule
  RuleType:
    is_a: EnumeratedValue
    class_uri: qudt:RuleType
  ScalarDatatype:
    is_a: Datatype
    slot_usage:
