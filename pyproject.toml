[build-system]
requires = ["hatchling>=1.20.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "qudt"
version = "0.1.0"
description = "QUDT LinkML Schema"
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.12,<3.14"
authors = [
    {name = "Vlad Korolev", email="vlad@v-lad.org"},
]
dependencies = [
    #"schema-automator>=0.5.3",
    "linkml-runtime",
    "marimo>=0.18.4",
    "rdflib>=7.3.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.9.0",
]

[tool.uv.sources]
linkml = { path = "../linkml/packages/linkml", editable = true }
linkml-runtime = { path = "../linkml/packages/linkml_runtime", editable = true }
grip = { git = "https://github.com/vladistan/grip.git", branch = "handle-test-sensitive-anchors" }

[dependency-groups]
dev = [
    "linkml",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
    "grip>=4.6.0",
    "markdown>=3.4.0",
    "pygments>=2.14.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [
  { path = "README.md" },
  { path = "CHANGES.md" },
]

[tool.hatch.version]
path = "src/linkml_qudt/__about__.py"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.hatch.build.targets.wheel]
packages = ["src/linkml_qudt"]

[project.scripts]
patch-qudt-schema = "linkml_qudt.cli.patch_schema:app"

[tool.codespell]
skip = "original/*,project/*,datadict/*,src/linkml_qudt/datamodel/*"
ignore-words = ".cspell"

[tool.pytest.ini_options]
testpaths = ["tests"]
